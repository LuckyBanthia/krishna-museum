spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/krishna_museum}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password_here}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Optional local overrides for developer credentials (git-ignored)
spring.config.import=optional:classpath:application-local.properties

# Ensure SPRING_SESSION tables exist for JDBC-backed HTTP sessions.
spring.session.jdbc.initialize-schema=always