<!DOCTYPE html>
<html>
<head>
    <title>Artefacts - Krishna Museum</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <h2>Krishna Museum</h2>

    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/travel">Travel</a></li>
        <li><a href="/artefacts">Artefacts</a></li>
        <li><a href="/timeline">Timeline</a></li>
        <li><a href="/events">Events</a></li>
        <li><a href="/wishlist">❤️ Wishlist (<span class="wishlist-counter-badge">0</span>)</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
    </ul>

    <div class="auth-buttons">
    <a href="/login" id="loginBtn" class="btn">Login</a>
    <a href="/register" id="registerBtn" class="btn">Register</a>
    <a href="/dashboard" id="dashboardBtn" class="btn" style="display:none;">Dashboard</a>
    <a href="/admin" id="adminBtn" class="btn" style="display:none;">Admin</a>
    <button id="logoutBtn" onclick="logout()" class="btn">Logout</button>
    <span id="welcomeText" style="margin-left:10px; color:#bb86fc;"></span>
</div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>Explore Artefacts</h1>
    <p>Browse by category and discover heritage</p>
</section>

<!-- FILTERS -->
<div class="filters">
    <button onclick="filterType('All')">All</button>
    <button onclick="filterType('Sculpture')">Sculptures</button>
    <button onclick="filterType('Painting')">Paintings</button>
    <button onclick="filterType('Coin')">Coins</button>
    <button onclick="filterType('Inscription')">Inscriptions</button>
    <button onclick="filterType('Ritual Object')">Ritual</button>
</div>

<!-- ADVANCED FILTERS -->
<div id="advanced-filters-container"></div>

<!-- SEARCH -->
<div class="search-section">
    <input type="text" id="searchInput" placeholder="Search artefacts...">
    <button onclick="search()">Search</button>
</div>

<!-- ARTEFACT LIST -->
<div id="artefacts-container" class="artefact-grid"></div>


<div id="artefactModal" class="modal-overlay" onclick="closeModal(event)">
  <div class="detail-modal">

    <button class="modal-close" onclick="closeModalDirect()">✕</button>

    <div class="detail-layout">
      
      <div class="detail-left">
        <img id="detailImage">
      </div>

      <div class="detail-right">
        <div id="detailCode" class="detail-code"></div>
        <h2 id="detailName"></h2>
        <p id="detailType"></p>

        <div class="detail-grid">
          <div><strong>Material:</strong> <span id="detailMaterial"></span></div>
          <div><strong>Dynasty:</strong> <span id="detailDynasty"></span></div>
          <div><strong>Region:</strong> <span id="detailRegion"></span></div>
          <div><strong>Deity:</strong> <span id="detailDeity"></span></div>
          <div><strong>Museum:</strong> <span id="detailMuseum"></span></div>
        </div>

        <p id="detailDesc" class="detail-desc"></p>
      </div>

    </div>
  </div>
</div>
<script src="/js/wishlist.js"></script>
<script src="/js/script.js"></script>
<script src="/js/artefacts.js"></script>
<script src="/js/animations.js"></script>
<script src="/js/advanced-filters.js"></script>
<script src="/js/theme-toggle.js"></script>
</body>
</html>
